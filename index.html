<!doctype html><html lang="ru" data-build="1793895991277"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Bunpō"><meta name="format-detection" content="telephone=no"></head><body>
<title>Bunpō N5–N4</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: спокойная верхняя навигация и одна колонка панелей. Цвета книг Genki только как метки, всё главное нейтральное */
:root {
  --bg: #F5F5F3; --surface: #FFFFFF; --sunk: #ECECE8; --line: #E2E2DD; --line-2: #CFCFC8;
  --ink: #1D1E20; --ink-2: #5C5E63; --ink-3: #85878C;
  --g1: #DD7A1F; --g2: #2F9E55;
  --good: #2E8B5E; --good-soft: #E2F2E9; --bad: #C8483F; --bad-soft: #F8E6E4;
  --m1: #D6605A; --m2: #DB9450; --m3: #D1B65C; --m4: #8DBB76; --m5: #55AE82;
  --sans: "Onest", "Noto Sans JP", "Segoe UI", "Yu Gothic UI", Meiryo, system-ui, sans-serif;
  --jp: "Noto Sans JP", "Yu Gothic UI", "Hiragino Sans", Meiryo, sans-serif;
  --r: 22px;
  --gut: max(24px, calc((var(--vw, 100vw) - 1240px) / 2));
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #09090C; --surface: rgba(255, 255, 255, .045); --sunk: rgba(255, 255, 255, .07); --line: rgba(255, 255, 255, .08); --line-2: rgba(255, 255, 255, .16);
  --ink: #F5F5F7; --ink-2: #A1A1AA; --ink-3: #71717A;
  --g1: #FF9A45; --g2: #55CF7A;
  --good: #4ADE80; --good-soft: rgba(74, 222, 128, .12); --bad: #FB7185; --bad-soft: rgba(251, 113, 133, .12);
  --m1: #FB7185; --m2: #FB9F5C; --m3: #FACC6B; --m4: #A3E48B; --m5: #4ADE9C;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #09090C; --surface: rgba(255, 255, 255, .045); --sunk: rgba(255, 255, 255, .07); --line: rgba(255, 255, 255, .08); --line-2: rgba(255, 255, 255, .16);
  --ink: #F5F5F7; --ink-2: #A1A1AA; --ink-3: #71717A;
  --g1: #FF9A45; --g2: #55CF7A;
  --good: #4ADE80; --good-soft: rgba(74, 222, 128, .12); --bad: #FB7185; --bad-soft: rgba(251, 113, 133, .12);
  --m1: #FB7185; --m2: #FB9F5C; --m3: #FACC6B; --m4: #A3E48B; --m5: #4ADE9C;
  color-scheme: dark; }

* { box-sizing: border-box; }
html, body, #app { height: 100%; overflow: hidden; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
:focus-visible { outline: 2px solid var(--ink-2); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-weight: 600; text-wrap: balance; }
ruby { ruby-position: over; }
rt { font-size: .5em; font-weight: 400; color: var(--ink-3); font-family: var(--jp); }
.no-furi rt { display: none; }
.ja { font-family: var(--jp); }
.hl { font-weight: 600; text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; }
.m1, .tint-m1 { --tint: var(--m1); } .m2, .tint-m2 { --tint: var(--m2); } .m3, .tint-m3 { --tint: var(--m3); } .m4, .tint-m4 { --tint: var(--m4); } .m5, .tint-m5 { --tint: var(--m5); }
.g1 { --book: var(--g1); } .g2 { --book: var(--g2); }

/* Каркас: каждая страница на один экран */
.shell { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.side { display: flex; align-items: center; gap: 28px; padding: 10px var(--gut); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; gap: 8px; }
.brand b { font: 700 20px var(--jp); }
.brand span { font-size: 14px; color: var(--ink-3); }
.nav { display: flex; gap: 4px; }
.nav button { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 9px; color: var(--ink-2); }
.nav button:hover { color: var(--ink); background: var(--sunk); }
.nav button.on { color: var(--ink); background: var(--sunk); font-weight: 500; }
.badge { font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink); background: var(--line-2); padding: 0 7px; border-radius: 99px; line-height: 19px; }
.main { flex: 1; min-height: 0; overflow-y: auto; padding: 14px var(--gut); }
.col { display: grid; gap: 12px; min-height: 100%; align-content: start; }
.bottom { display: none; }
.col > section, .plan, .tile-s, .book-card, .chart, .blk, .curve { background: var(--surface); border-radius: var(--r); }

/* Общее */
.eyebrow { font-size: 13px; color: var(--ink-3); }
.btn { display: inline-flex; align-items: center; justify-content: center; padding: 11px 28px; background: var(--ink); color: var(--bg); font-weight: 600; border-radius: 11px; white-space: nowrap; }
.btn:hover { opacity: .88; }
.btn[disabled] { opacity: .4; cursor: default; }
.btn-2 { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-2); font-weight: 500; }
.btn-2:hover { background: var(--sunk); opacity: 1; }
.btn-sm { padding: 7px 14px; font-size: 14px; }
.link, .linkish { color: var(--ink-2); font-size: 14px; text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; }
.link:hover, .linkish:hover, .back:hover { color: var(--ink); }
.back { color: var(--ink-2); font-size: 14px; }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.sec-h h2 { font-size: 15.5px; }
.sec-h span { font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.today-h { display: grid; gap: 4px; }
.today-h h1 { font-size: 26px; line-height: 1.2; }
.today-h p { color: var(--ink-2); }
.empty { color: var(--ink-2); font-size: 14px; margin: 0; }
.book { display: inline-flex; align-items: center; gap: 6px; }
.book i, .book-h h2 i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--book); }

/* Главная */
.plan { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 14px 20px; }
.plan-t { display: grid; gap: 1px; }
.plan h1 { font-size: 24px; line-height: 1.25; }
.plan p { color: var(--ink-2); font-size: 14.5px; }
.tiles-s { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tile-s { display: grid; gap: 0; padding: 11px 16px; }
.tile-s b { font-size: 25px; font-weight: 600; line-height: 1.15; font-variant-numeric: tabular-nums; }
.tile-s b em { font-style: normal; font-size: .6em; font-weight: 500; color: var(--ink-3); }
.tile-s span { font-size: 14px; }
.tile-s small { font-size: 12.5px; color: var(--ink-3); }
.books { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.book-card { padding: 12px 18px; }
.book-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.book-h h2 { display: flex; align-items: center; gap: 8px; font-size: 15.5px; }
.book-h span { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.book-bar { height: 4px; margin: 7px 0 8px; background: var(--sunk); border-radius: 9px; overflow: hidden; }
.book-bar i { display: block; height: 100%; background: var(--book); border-radius: 9px; }
.g-row { display: grid; grid-template-columns: 24px minmax(0, 1fr) 40px; gap: 8px; align-items: center; min-height: 22px; }
.g-row .ln { font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.g-row .lp { font-size: 12.5px; color: var(--ink-2); text-align: right; font-variant-numeric: tabular-nums; }
.cells { display: flex; flex-wrap: wrap; gap: 3px; }
.cell { position: relative; width: 18px; height: 18px; border-radius: 5px; background: var(--sunk); }
.cell.m1, .cell.m2, .cell.m3, .cell.m4, .cell.m5 { background: var(--tint); }
.cell.due::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: var(--surface); }
.cell:hover { outline: 2px solid var(--ink); outline-offset: 1px; }
.charts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.chart { padding: 11px 16px; }
.bars { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 3px; height: 62px; align-items: end; }
.bar-w { height: 100%; display: flex; align-items: flex-end; }
.bar-w i { display: block; width: 100%; min-height: 2px; background: var(--line-2); border-radius: 3px 3px 0 0; }
.bar-w:hover i { background: var(--ink-2); }
.bar-x { display: flex; justify-content: space-between; margin-top: 3px; font-size: 12px; color: var(--ink-3); }
.bands { display: grid; gap: 3px; }
.band { display: grid; grid-template-columns: 62px minmax(0, 1fr) 28px; gap: 8px; align-items: center; font-size: 12.5px; color: var(--ink-2); }
.band div { height: 9px; background: var(--sunk); border-radius: 9px; overflow: hidden; }
.band i { display: block; height: 100%; background: var(--tint); border-radius: 9px; }
.band b { font-weight: 500; text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; }
#tip { position: fixed; z-index: 50; pointer-events: none; background: var(--ink); color: var(--bg); padding: 5px 9px; border-radius: 7px; font-size: 13px; line-height: 1.3; max-width: 280px; }

/* Тема */
.topic { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.c1, .c2 { display: grid; gap: 12px; min-width: 0; }
.t-head { display: grid; gap: 3px; }
.t-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: 13px; color: var(--ink-3); }
.pill { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.pill.acc { color: var(--ink); font-weight: 500; }
.t-title { font: 700 30px/1.45 var(--jp); overflow-wrap: anywhere; }
.t-gist { font-size: 18px; color: var(--ink-2); }
.blk { display: grid; gap: 8px; padding: 14px 18px; }
.blk p { line-height: 1.6; }
.lab { font-size: 13px; font-weight: 600; color: var(--ink-3); text-transform: lowercase; }
.lab::first-letter { text-transform: uppercase; }
.rule { font-size: 18px; font-weight: 500; line-height: 1.55; padding: 14px 18px; background: var(--sunk); border-radius: var(--r); }
.cap { font-size: 14px; font-weight: 600; margin-top: 6px; }
.tbl-w { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 15.5px; }
th { text-align: left; font-weight: 500; font-size: 12.5px; color: var(--ink-3); padding: 3px 14px 5px 0; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
td { padding: 6px 14px 6px 0; border-bottom: 1px solid var(--line); vertical-align: baseline; }
tr:last-child td { border-bottom: 0; }
.notes { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 15px; }
.src { font-size: 13px; color: var(--ink-3); margin: 0; }
.links { display: grid; gap: 6px; }
.links .row { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; font-size: 13px; color: var(--ink-3); }
.chip { display: inline-flex; align-items: baseline; gap: 5px; padding: 2px 9px; background: var(--surface); border-radius: 8px; font-size: 13.5px; color: var(--ink); }
.chip:hover { background: var(--sunk); }
.chip em { font-style: normal; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.curve { padding: 12px 18px; }
.curve svg { width: 100%; height: auto; max-height: 110px; display: block; overflow: visible; }
.curve .lab { margin-bottom: 6px; }
.mem-row { display: flex; flex-wrap: wrap; gap: 3px 16px; font-size: 13px; color: var(--ink-2); margin-bottom: 6px; }
.mem-row b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
.say { display: none; }

/* Карта форм */
.tabs { display: flex; flex-wrap: wrap; gap: 4px; }
.tab { padding: 3px 11px; border-radius: 9px; font: 400 15px/1.75 var(--jp); color: var(--ink-2); }
.tab:hover { background: var(--sunk); color: var(--ink); }
.tab.on { background: var(--ink); color: var(--bg); font-weight: 500; }
.tab.on rt { color: var(--bg); }
.tabs.rows .tab { font: 500 13.5px/1.6 var(--sans); background: var(--surface); }
.tabs.rows .tab.on { background: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 3px 12px; font-size: 12.5px; color: var(--ink-2); }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; background: var(--tint, transparent); }
.col > section { padding: 14px 18px; }
.base { display: grid; gap: 8px; align-content: start; }
.base-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; }
.base-h b { font: 600 25px/1.6 var(--jp); }
.base-h span { font-size: 14px; color: var(--ink-2); }
.base-w { font-size: 14.5px; color: var(--ink-2); max-width: 72ch; margin: 0; }
.forms { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 6px; }
.form { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 8px; padding: 8px 11px; align-items: baseline; border-radius: 10px; background: var(--bg); }
.form:hover { box-shadow: inset 0 0 0 1px var(--line-2); }
.form[class*="tint-"] { background: color-mix(in srgb, var(--tint) 22%, var(--surface)); }
.form .j { font: 400 16.5px/1.65 var(--jp); grid-column: 1; overflow-wrap: anywhere; }
.form .r { font-size: 13px; color: var(--ink-2); grid-column: 1 / -1; line-height: 1.3; }
.form .p { grid-row: 1; grid-column: 2; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.form[class*="tint-"] .r, .form[class*="tint-"] .p { color: var(--ink); }
.kinds { display: grid; gap: 10px; }
.kind { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 8px; }
.kind > b { font-weight: 500; font-size: 14px; }
.kind > div { display: flex; flex-wrap: wrap; gap: 4px; }
.kind .chip { background: var(--sunk); }

/* Настройки */
.view-settings { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.view-settings > .today-h { grid-column: 1 / -1; }
.set-r { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 0; flex-wrap: wrap; font-size: 15px; }
.set-r span { display: block; font-size: 13px; color: var(--ink-2); }
.seg { display: inline-flex; padding: 2px; background: var(--sunk); border-radius: 9px; }
.seg button { padding: 4px 11px; font-size: 14px; color: var(--ink-2); border-radius: 7px; }
.seg button.on { background: var(--surface); color: var(--ink); font-weight: 500; }
.backup { width: 100%; min-height: 80px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px; font: 12px/1.4 ui-monospace, Consolas, monospace; }

/* Занятие */
.sess { height: 100%; display: flex; flex-direction: column; min-height: 0; }
.sess-top { background: var(--bg); }
.sess-r { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 10px var(--gut) 8px; font-size: 14px; color: var(--ink-2); }
.sess-r b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
.lbar { height: 3px; background: var(--line); }
.lbar i { display: block; height: 100%; background: var(--ink-2); transition: width .2s; }
.sess-body { flex: 1; min-height: 0; overflow-y: auto; padding: 14px var(--gut); }
.sess-col { display: grid; gap: 14px; min-height: 100%; align-content: start; }
.flash { font-size: 13.5px; color: var(--ink-2); }
.flash b { color: var(--ink); font-weight: 500; }
.foot { background: var(--bg); border-top: 1px solid var(--line); padding: 10px var(--gut) calc(10px + env(safe-area-inset-bottom, 0px)); }
.foot-in { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.foot-in small { color: var(--ink-3); font-size: 13px; }
.foot-in.rates { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.rate { display: grid; gap: 1px; justify-items: center; text-align: center; padding: 8px 4px; background: var(--surface); border-radius: 11px; min-width: 0; }
.rate:hover { background: var(--sunk); }
.rate b { font-weight: 600; font-size: 15px; }
.rate small { font-size: 12.5px; color: var(--ink-2); }
.rate kbd { font: inherit; color: var(--ink-3); }
.summary { display: grid; gap: 14px; padding-top: 10vh; max-width: 560px; }
.sum-nums { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.sum-nums b { display: block; font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
.sum-nums span { font-size: 13.5px; color: var(--ink-2); }
.q-tag { font-size: 13px; color: var(--ink-3); }
.q-text { font-size: 21px; line-height: 1.5; margin: 0; }
.opts { display: grid; gap: 6px; }
.opt { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: baseline; padding: 10px 14px; background: var(--surface); border-radius: 11px; font: 400 18px/1.7 var(--jp); width: 100%; }
.opt:hover:not([disabled]) { background: var(--sunk); }
.opt kbd { font: 500 12.5px var(--sans); color: var(--ink-3); }
.opt.ok { background: var(--good-soft); }
.opt.no { background: var(--bad-soft); }
.opt[disabled] { cursor: default; }
.field { display: grid; gap: 6px; }
.field input { width: 100%; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 11px; font: 400 22px/1.4 var(--jp); }
.field input:focus { outline: 0; border-color: var(--ink-3); }
.field input.ok { background: var(--good-soft); }
.field input.no { background: var(--bad-soft); }
.field small { font-size: 13px; color: var(--ink-3); }
.tiles-ans { min-height: 58px; padding: 8px; background: var(--surface); display: flex; flex-wrap: wrap; gap: 6px; border-radius: 11px; }
.tiles-ans.ok { background: var(--good-soft); }
.tiles-ans.no { background: var(--bad-soft); }
.tiles { display: flex; flex-wrap: wrap; gap: 6px; }
.tile { padding: 5px 12px; background: var(--surface); border-radius: 9px; font: 400 18px/1.7 var(--jp); }
.tiles-ans .tile { background: var(--sunk); }
.tile:hover:not([disabled]) { background: var(--sunk); }
.tile.ghost { visibility: hidden; }
.fb { display: grid; gap: 4px; padding: 10px 14px; border-radius: 11px; font-size: 15px; }
.fb.ok { background: var(--good-soft); }
.fb.no { background: var(--bad-soft); }
.fb .h { font-weight: 600; }
.fb.ok .h { color: var(--good); } .fb.no .h { color: var(--bad); }
.fb .right { font: 400 18px/1.7 var(--jp); }

@media (max-width: 860px) {
  .side { display: none; }
  .shell { padding-bottom: calc(50px + env(safe-area-inset-bottom, 0px)); }
  .main, .sess-body, .sess-r, .foot { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .bottom { display: grid; grid-template-columns: repeat(3, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding: 5px max(8px, env(safe-area-inset-right, 0px)) calc(5px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  .bottom button { text-align: center; padding: 7px 2px; font-size: 13.5px; border-radius: 8px; color: var(--ink-2); }
  .bottom button.on { color: var(--ink); font-weight: 600; background: var(--sunk); }
  .plan .btn { width: 100%; }
  .tiles-s { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .books, .charts, .topic, .view-settings { grid-template-columns: minmax(0, 1fr); }
  .forms { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kind { grid-template-columns: minmax(0, 1fr); }
  .t-title { font-size: 26px; }
  .rate kbd { display: none; }
  .rate small { font-size: 11.5px; }
  .q-text { font-size: 19px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* Современный слой: стекло, крупная типографика, капсулы. Свечение на фоне — цвета книг */
body { background: radial-gradient(760px 460px at 6% -8%, color-mix(in srgb, var(--g1) 20%, transparent), transparent 72%), radial-gradient(860px 560px at 102% 108%, color-mix(in srgb, var(--g2) 20%, transparent), transparent 72%), var(--bg); background-attachment: fixed; letter-spacing: -.011em; }
h1, h2, h3 { letter-spacing: -.025em; }
.col > section, .plan, .tile-s, .book-card, .chart, .blk, .curve, .ring-card { background: var(--surface); border: 1px solid var(--line); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05); backdrop-filter: blur(22px); }
.side { border-bottom: 0; padding-top: 14px; padding-bottom: 6px; justify-content: space-between; }
.nav { padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; backdrop-filter: blur(22px); }
.nav button { border-radius: 99px; padding: 6px 16px; font-size: 14.5px; }
.nav button.on { background: var(--ink); color: var(--bg); }
.nav button.on .badge { background: var(--bg); color: var(--ink); }
.brand b { font-size: 22px; }
.brand::after { content: ""; width: 92px; }
.brand { min-width: 170px; }
.btn { border-radius: 99px; padding: 12px 30px; transition: transform .15s, opacity .15s; }
.btn:hover { transform: translateY(-1px); opacity: 1; }
.btn-2 { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-2); }
.bento { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 12px; }
.b-left { display: grid; gap: 12px; grid-template-rows: 1fr auto; min-width: 0; }
.plan { padding: 22px 26px; border-radius: var(--r); }
.plan h1 { font-size: clamp(30px, 3vw, 42px); line-height: 1.08; font-weight: 600; letter-spacing: -.035em; }
.plan-t { gap: 6px; }
.tiles-s { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.tile-s { padding: 13px 18px; }
.tile-s b { font-size: 30px; letter-spacing: -.03em; }
.ring-card { display: flex; align-items: center; gap: 20px; padding: 18px 22px; border-radius: var(--r); }
.ring { --size: 132px; flex: none; position: relative; width: var(--size); height: var(--size); border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--tint, var(--ink-3)) calc(var(--p) * 1%), var(--sunk) 0); }
.ring::before { content: ""; position: absolute; inset: 11px; border-radius: 50%; background: var(--ring-hole, #111116); }
.ring > div { position: relative; display: grid; justify-items: center; }
.ring b { font-size: 36px; font-weight: 600; line-height: 1; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.ring b small { font-size: .5em; color: var(--ink-2); }
.ring span { font-size: 12px; color: var(--ink-3); }
.ring-card dl { flex: 1; margin: 0; display: grid; gap: 8px; }
.ring-card dl div { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.ring-card dt { font-size: 12.5px; color: var(--ink-2); }
.ring-card dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
.ring-card p { font-size: 13px; color: var(--ink-2); }
.book-card { padding: 14px 20px; border-radius: var(--r); }
.book-h h2 { font-size: 17px; }
.book-bar { height: 5px; }
.book-card { background: linear-gradient(135deg, color-mix(in srgb, var(--book) 9%, transparent), transparent 42%), var(--surface); }
.cell { border-radius: 6px; }
.chart { padding: 13px 18px; border-radius: var(--r); }
.bars { gap: 4px; height: 60px; }
.bar-w { background: var(--sunk); border-radius: 99px; overflow: hidden; }
.bar-w i { background: var(--ink); opacity: .85; border-radius: 99px; min-height: 0; }
.bar-w:hover i { background: var(--ink); opacity: 1; }
.band div { height: 8px; }
.t-title { font: 600 44px/1.3 var(--sans); letter-spacing: -.035em; }
.t-title .ja { font-family: var(--jp); letter-spacing: 0; }
.t-gist { font-size: 20px; letter-spacing: -.02em; }
.rule { font-size: 19px; padding: 18px 22px; background: linear-gradient(135deg, var(--sunk), var(--surface)); border: 1px solid var(--line-2); }
.blk { padding: 16px 20px; }
.lab { letter-spacing: 0; }
.tab { border-radius: 99px; }
.tabs.rows .tab { border: 1px solid var(--line); }
.form { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.form[class*="tint-"] { background: color-mix(in srgb, var(--tint) 13%, transparent); border-color: color-mix(in srgb, var(--tint) 30%, transparent); }
.chip { background: var(--surface); border: 1px solid var(--line); border-radius: 99px; }
.kind .chip { background: var(--surface); }
.seg, .rate, .opt, .tile, .field input, .tiles-ans, .backup { border-radius: 14px; }
.seg { border-radius: 99px; }
.seg button { border-radius: 99px; }
.seg button.on { background: var(--ink); color: var(--bg); }
.rate { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; backdrop-filter: blur(22px); }
.sess-top, .foot { background: transparent; }
.foot { border-top: 0; }
.lbar { background: var(--sunk); }
.lbar i { background: var(--ink); }
.done, .summary h1 { letter-spacing: -.035em; }
#tip { border-radius: 10px; }
@media (max-width: 860px) {
  .bento { grid-template-columns: minmax(0, 1fr); }
  .tiles-s { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .tile-s { padding: 11px 12px; }
  .tile-s b { font-size: 22px; }
  .t-title { font-size: 30px; }
  .bottom { background: rgba(20, 20, 24, .85); backdrop-filter: blur(20px); }
}
.col, .sess-col { min-height: calc(100% - 2px); }

/* Заметная подача, анимации */
@property --p { syntax: "<number>"; inherits: false; initial-value: 0; }
:root { --mark: #B8730F; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --mark: #FFC56B; } }
:root[data-theme="dark"] { --mark: #FFC56B; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
@keyframes fromRight { from { opacity: 0; transform: translateX(34px); } }
@keyframes fromLeft { from { opacity: 0; transform: translateX(-34px); } }
@keyframes ringIn { from { --p: 0; } }
@keyframes growY { from { transform: scaleY(0); } }
@keyframes growX { from { transform: scaleX(0); } }
.enter > * { animation: rise .42s cubic-bezier(.2, .7, .2, 1) backwards; }
.enter > :nth-child(2) { animation-delay: .05s; } .enter > :nth-child(3) { animation-delay: .1s; } .enter > :nth-child(4) { animation-delay: .15s; } .enter > :nth-child(5) { animation-delay: .2s; }
.enter.from-right > * { animation: fromRight .32s cubic-bezier(.2, .7, .2, 1) backwards; animation-delay: 0s; }
.enter.from-left > * { animation: fromLeft .32s cubic-bezier(.2, .7, .2, 1) backwards; animation-delay: 0s; }
.enter .ring { animation: ringIn 1s cubic-bezier(.2, .7, .2, 1) backwards; }
.enter .bar-w i { animation: growY .6s cubic-bezier(.2, .7, .2, 1) backwards; transform-origin: bottom; }
.enter .book-bar i, .enter .band i { animation: growX .7s cubic-bezier(.2, .7, .2, 1) backwards; transform-origin: left; }
.cell, .form, .fact, .tile-s, .rate, .arrow, .chip, .tab, .nav button, .bar-w i { transition: transform .16s ease, background-color .16s ease, border-color .16s ease, color .16s ease, opacity .16s ease; }
.cell:hover { transform: scale(1.22); outline: 0; }
.form:hover, .fact[data-topic]:hover, .rate:hover { transform: translateY(-2px); }
.lbar i { transition: width .35s cubic-bezier(.2, .7, .2, 1); }

/* Главная */
.facts { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.fact { display: grid; gap: 1px; align-content: start; padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; min-width: 0; backdrop-filter: blur(22px); }
button.fact:hover { border-color: var(--line-2); }
.fact span { font-size: 12px; color: var(--ink-3); }
.fact b { font-size: 15.5px; font-weight: 600; line-height: 1.45; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fact b em { font-style: normal; color: var(--mark); }
.fact small { font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bars { height: 52px; }
.bar-w { background: none; border-radius: 0; overflow: visible; }
.bar-w i { background: var(--ink-2); opacity: 1; border-radius: 4px 4px 2px 2px; }
.bar-w:hover i { background: var(--mark); }
.tile-s b em { font-size: .55em; }
.g-row { min-height: 20px; }
.cell { width: 17px; height: 17px; }

/* Тема: ключевое бросается в глаза */
.t-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.arrows { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.arrow { width: 38px; height: 38px; display: grid; place-items: center; font-size: 17px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line-2); color: var(--ink); }
.arrow:hover:not([disabled]) { background: var(--ink); color: var(--bg); transform: scale(1.06); }
.arrow[disabled] { opacity: .3; cursor: default; }
.t-gist { color: var(--mark); font-weight: 500; font-size: 21px; }
.t-meta .pill.acc { font-weight: 600; }
.rule { display: grid; gap: 4px; font-size: 20px; font-weight: 600; line-height: 1.45; color: var(--ink); border-color: color-mix(in srgb, var(--mark) 45%, transparent); background: linear-gradient(135deg, color-mix(in srgb, var(--mark) 14%, transparent), var(--surface)); }
.rule .lab { color: var(--mark); font-size: 12px; }
.rule .ja, .blk p .ja, .excs .ja { color: var(--mark); font-weight: 600; }
.lab { font-size: 12.5px; }
.blk p { font-size: 15.5px; }
td:has(.ja) { font-size: 18px; font-weight: 500; }
td:not(:has(.ja)) { font-size: 14px; color: var(--ink-2); }
td:first-child:not(:has(.ja)) { color: var(--ink-3); }
tbody tr { transition: background-color .15s ease; }
tbody tr:hover { background: var(--sunk); }
.excs { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
.excs li { padding: 6px 12px; background: var(--sunk); border-radius: 12px; font-size: 15.5px; font-weight: 500; }
.metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.metrics div { display: grid; padding: 8px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.metrics b { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.metrics span { font-size: 12px; color: var(--ink-3); }

/* Карта форм одной страницей */
.view-map { gap: 14px; }
.map-bar { position: sticky; top: -14px; z-index: 4; display: grid; gap: 6px; padding: 10px 14px; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(16px); border: 1px solid var(--line); border-radius: 18px; }
.base-h b { color: var(--mark); }
.base-h strong { font-weight: 600; color: var(--ink); }
@media (max-width: 860px) {
  .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .rule { font-size: 18px; }
}
@media (prefers-reduced-motion: reduce) { *, .enter > *, .enter .ring, .enter .bar-w i, .enter .book-bar i, .enter .band i { animation: none !important; } }
td { padding-top: 3px; padding-bottom: 3px; line-height: 1.55; }
td:has(.ja) { font-size: 16.5px; }
.topic td { padding-top: 3px; padding-bottom: 3px; }
.fact b rt { display: none; }

/* Кнопка и страница новых тем */
.tile-new { text-align: left; border-color: color-mix(in srgb, var(--mark) 45%, transparent); background: linear-gradient(135deg, color-mix(in srgb, var(--mark) 13%, transparent), var(--surface)); transition: transform .16s ease, border-color .16s ease; }
.tile-new:hover { transform: translateY(-2px); border-color: var(--mark); }
.tile-new span { font-weight: 600; }
.tile-new small { color: var(--mark); }
.view-today .charts { grid-template-columns: minmax(0, 1fr); }
.view-today .bars { height: 72px; }
.g-row { min-height: 24px; }
.cell { width: 20px; height: 20px; }
.news { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 12px; }
.news-card { display: grid; gap: 6px; align-content: start; padding: 16px 20px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); backdrop-filter: blur(22px); transition: transform .16s ease, border-color .16s ease; }
.news-card:hover { transform: translateY(-2px); border-color: var(--line-2); }
.news-card h2 { font-size: 24px; line-height: 1.4; }
.news-g { color: var(--mark); font-weight: 500; font-size: 16px; }
.news-r { color: var(--ink-2); font-size: 14.5px; line-height: 1.5; }
.num { width: 92px; padding: 6px 12px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; background: var(--sunk); border: 1px solid var(--line-2); border-radius: 12px; }
.num:focus { outline: 0; border-color: var(--ink-2); }
.news-group { display: grid; gap: 4px; background: none !important; border: 0 !important; box-shadow: none !important; backdrop-filter: none !important; padding: 0 !important; }
.news-group .sec-h h2 { font-size: 18px; }
.news { grid-template-columns: minmax(0, 1fr); }
.news-card { gap: 12px; padding: 18px 22px; }
.news-card:hover { transform: none; }
.news-card .topic { align-items: start; }
.news-card .blk { background: var(--surface); }

/* Фильтр тем на главной */
:root { --ring-hole: #FFFFFF; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ring-hole: #111116; } }
:root[data-theme="dark"] { --ring-hole: #111116; }
.filter { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.fsearch { flex: 1 1 260px; min-width: 0; padding: 9px 16px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 99px; backdrop-filter: blur(22px); }
.fsearch:focus { outline: 0; border-color: var(--ink-2); }
.fsearch::placeholder { color: var(--ink-3); }
.fchip { display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; font-size: 13.5px; color: var(--ink-2); transition: background-color .16s ease, color .16s ease, border-color .16s ease; }
.fchip:hover { color: var(--ink); border-color: var(--line-2); }
.fchip em { font-style: normal; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.fchip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.fchip.on em { color: var(--bg); opacity: .7; }
.results { padding: 14px 18px; }
.hits { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 14px; max-height: 330px; overflow-y: auto; padding-right: 4px; }
.hit { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 10px; border-radius: 12px; transition: background-color .15s ease; }
.hit:hover { background: var(--sunk); }
.hit-id { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.hit-t { display: grid; min-width: 0; }
.hit-t b { font-weight: 600; font-size: 15px; line-height: 1.6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hit-t small { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hit-m { display: grid; justify-items: end; font-variant-numeric: tabular-nums; }
.hit-m b { font-size: 14px; }
.hit-m small { font-size: 12px; color: var(--ink-3); white-space: nowrap; }
@media (max-width: 860px) { .hits { grid-template-columns: minmax(0, 1fr); max-height: none; } }
/* Прогноз: тонкие столбики вместо сплошных блоков */
.view-today .bars { gap: 10px; }
.view-today .bar-w { justify-content: center; }
.view-today .bar-w i { width: min(100%, 30px); background: color-mix(in srgb, var(--ink-2) 70%, transparent); }
.view-today .bar-w:first-child i { background: var(--mark); }
/* Ничего не распирает колонку по ширине (карта на телефоне вылезала на 10px) */
.col:not(.view-today):not(.view-settings) { grid-template-columns: minmax(0, 1fr); }
.col > * { min-width: 0; }
@media (max-width: 860px) {
  .tiles-s { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tile-new { grid-column: 1 / -1; }
  .view-today, .view-settings { grid-template-columns: minmax(0, 1fr); }
}

/* Главная: компактные книги и типы работы справа */
.learn-row { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 12px; align-items: stretch; }
.learn-row .books { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.learn-row .book-card { padding: 12px 16px; }
.learn-row .g-row { min-height: 17px; grid-template-columns: 20px minmax(0, 1fr) 34px; gap: 6px; }
.learn-row .cell { width: 14px; height: 14px; border-radius: 4px; }
.learn-row .cell.due::after { inset: 4px; }
.learn-row .cells { gap: 2px; }
.learn-row .g-row .ln, .learn-row .g-row .lp { font-size: 11.5px; }
.cell { transition: opacity .25s ease, transform .16s ease; }
.cell.dim { opacity: .12; }
.ltypes { display: grid; gap: 4px; align-content: start; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); backdrop-filter: blur(22px); }
.ltype { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 8px 12px; border-radius: 12px; border: 1px solid transparent; transition: background-color .16s ease, border-color .16s ease; }
.ltype:hover { background: var(--sunk); }
.ltype.on { background: var(--sunk); border-color: var(--line-2); }
.ltype span { font-weight: 600; font-size: 14.5px; }
.ltype em { font-style: normal; font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ltype em b { font-weight: 600; }
.ltype-how { display: grid; gap: 6px; margin-top: 6px; padding: 12px 14px; border-radius: 14px; background: linear-gradient(135deg, color-mix(in srgb, var(--mark) 12%, transparent), transparent); border: 1px solid color-mix(in srgb, var(--mark) 35%, transparent); font-size: 13.5px; line-height: 1.5; }
.ltype-how b { color: var(--mark); }
.ltype-hint { font-size: 13px; color: var(--ink-3); margin-top: 6px; }

/* Занятие: пересказ и сверка */
.recall { display: grid; gap: 10px; max-width: 860px; }
.recall-ask { font-size: 18px; font-weight: 600; color: var(--mark); }
.recall-box { width: 100%; min-height: 190px; resize: vertical; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 16px; font: 400 17px/1.6 var(--sans); color: var(--ink); }
.recall-box:focus { outline: 0; border-color: var(--ink-2); }
.conf { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13.5px; color: var(--ink-2); }
.conf .fchip { display: inline-flex; padding: 6px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; color: var(--ink-2); }
.conf .fchip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.mine { display: grid; gap: 6px; padding: 14px 18px; border-radius: var(--r); background: var(--surface); border: 1px dashed var(--line-2); }
.mine p { white-space: normal; font-size: 15.5px; line-height: 1.55; }
.mine small { font-size: 12.5px; color: var(--ink-3); }
.mine .mine-tip { color: var(--mark); }
.sum-warn { padding: 12px 16px; border-radius: 14px; background: var(--bad-soft); color: var(--ink); }
@media (max-width: 860px) {
  .learn-row { grid-template-columns: minmax(0, 1fr); }
}
.ltype { padding: 6px 12px; }
.ltype-how { padding: 10px 12px; font-size: 13px; gap: 4px; }
.view-today .bars { height: 46px; }
.learn-row { grid-template-columns: minmax(0, 1fr) 400px; }

/* Проверка себя: скрытые места */
.cz { position: relative; border-radius: 8px; transition: background-color .2s ease, box-shadow .2s ease; }
td.cz { border-radius: 0; }
.cz-hide > span, .cz-cur:not(.cz-shown) > span { visibility: hidden; }
.cz-hide { background: repeating-linear-gradient(135deg, var(--sunk) 0 6px, transparent 6px 12px); }
.cz-cur:not(.cz-shown) { background: color-mix(in srgb, var(--mark) 22%, transparent); box-shadow: inset 0 0 0 2px var(--mark); cursor: pointer; }
.cz-cur:not(.cz-shown)::after { content: "?"; position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; color: var(--mark); }
.cz-cur.cz-shown { box-shadow: inset 0 0 0 2px var(--mark); }
.cz-ok { background: color-mix(in srgb, var(--m5) 14%, transparent); }
.cz-miss { background: color-mix(in srgb, var(--m1) 18%, transparent); box-shadow: inset 3px 0 0 var(--m1); }
.t-gist.cz { display: inline-block; padding: 0 8px; margin-left: -8px; min-width: 200px; }
.rule .cz { padding: 2px 6px; margin: 0 -6px; }
.cz-sum { max-width: 1240px; margin: 0 auto 8px; font-size: 14px; color: var(--ink-2); }
.rate.sug { border-color: var(--mark); box-shadow: inset 0 0 0 1px var(--mark); }

/* Шпаргалка */
.sh-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.sh-head h1 { font-size: 24px; }
.sh-head p { color: var(--ink-2); font-size: 14px; }
.sheet { columns: 4 300px; column-gap: 14px; }

/* Экран вопроса: одна спокойная карточка по центру */
.phase-task .sess-col, .phase-result .sess-col { max-width: 720px; margin: 0 auto; width: 100%; padding-top: 3vh; }
.quiz { display: grid; gap: 10px; }
.qz-meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 13px; color: var(--ink-3); }
.q-src { font-style: normal; font-size: 12px; color: var(--ink-2); background: var(--sunk); padding: 2px 9px; border-radius: 99px; }

.qz-card { display: grid; gap: 16px; padding: 24px 26px 26px; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; }
.qz-ctx { display: grid; gap: 0; padding: 10px 14px; border-radius: 14px; background: var(--sunk); font-size: 14px; line-height: 1.5; color: var(--ink-2); }

.gap { display: inline-block; min-width: 3.2em; height: 1.1em; margin: 0 4px; vertical-align: -0.2em; border-bottom: 2px solid var(--mark); background: color-mix(in srgb, var(--mark) 10%, transparent); border-radius: 6px 6px 2px 2px; }
.qz-hint { font: italic 400 14px var(--sans); color: var(--mark); white-space: nowrap; }
.qz-how { font-size: 12.5px; color: var(--ink-3); margin-top: -8px; }
.quiz .opt { border: 1px solid var(--line); background: transparent; transition: background .15s, border-color .15s, opacity .2s; }
.quiz .opt:hover:not([disabled]) { background: var(--sunk); border-color: var(--line-2); }
.quiz .opt.ok { background: var(--good-soft); border-color: transparent; }

.tiles-ph { color: var(--ink-3); font-size: 13.5px; padding: 0 6px; }
.quiz .tile { border: 1px solid var(--line); background: var(--surface); transition: background .15s, transform .12s; }
.quiz .tile:hover:not([disabled]) { background: var(--sunk); transform: translateY(-1px); }
.quiz .fb { animation: rise .3s cubic-bezier(.2, .7, .2, 1); padding: 12px 16px; border-radius: 14px; }
.quiz .fb .why { color: var(--ink-2); font-size: 14.5px; }
@media (max-width: 860px) {

}

.qz-help { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: -4px; }

.phase-task .sess-col, .phase-result .sess-col, .phase-task .foot-in, .phase-result .foot-in { max-width: 780px; }

const FURI_KEYS = Object.keys(FURI).sort((a, b) => b.length - a.length);
const JP_RUN = /[぀-ヿ㐀-鿿々〜ー]+(?:\{[^}]+\}[぀-ヿ㐀-鿿々〜ー]*)*/g;
const isKanji = c => /[㐀-鿿々]/.test(c);

// Разбирает японский кусок на [текст, чтение|null]
function furiTokens(run) {
  const out = []; let i = 0;
  const push = (t, r) => out.push([t, r || null]);
  while (i < run.length) {
    if (run[i + 1] === '{' && isKanji(run[i])) {
      const end = run.indexOf('}', i);
      push(run[i], run.slice(i + 2, end)); i = end + 1; continue;
    }
    if (!isKanji(run[i]) && !FURI_FIRST.has(run[i])) { push(run[i]); i++; continue; }
    let hit = null;
    for (const k of FURI_BY[run[i]] || []) if (run.startsWith(k, i)) { hit = k; break; }
    if (!hit) { push(run[i]); i++; continue; }
    const v = FURI[hit];
    if (v.includes('{')) templateTokens(v).forEach(t => out.push(t)); else push(hit, v);
    i += hit.length;
  }
  return out;
}
// Запись словаря с разметкой по иероглифам: 来{き}ます
function templateTokens(v) {
  const out = [];
  for (let i = 0; i < v.length; i++) {
    if (v[i + 1] === '{') { const end = v.indexOf('}', i); out.push([v[i], v.slice(i + 2, end)]); i = end; }
    else out.push([v[i], null]);
  }
  return out;
}
const FURI_BY = {}, FURI_FIRST = new Set();
FURI_KEYS.forEach(k => { (FURI_BY[k[0]] = FURI_BY[k[0]] || []).push(k); FURI_FIRST.add(k[0]); });

// Весь текст каной: для проверки ввода
function toReading(s) {
  return furiTokens(String(s).replace(/\[|\]/g, '')).map(([t, r]) => r || t).join('');
}

// final=true: хвостовая n становится ん (при проверке)
function romajiToKana(input, final) {
  const s = input.toLowerCase(); let out = '', i = 0;
  while (i < s.length) {
    const c = s[i];
    if (!/[a-z'-]/.test(c)) { out += c; i++; continue; }
    if (c === 'n') {
      const nx = s[i + 1];
      if (nx === 'n') { out += 'ん'; i += /[aiueoy]/.test(s[i + 2] || '') ? 1 : 2; continue; }
      if (nx === "'") { out += 'ん'; i += 2; continue; }
      if (nx && !/[aiueoy]/.test(nx)) { out += 'ん'; i++; continue; }
      if (nx === undefined) { if (final) { out += 'ん'; i++; continue; } out += c; i++; continue; }
    }
    if (c !== 'n' && c === s[i + 1] && /[bcdfghjkmpqrstvwxyz]/.test(c)) { out += 'っ'; i++; continue; }
    let done = false;
    for (const len of [3, 2, 1]) {
      const k = s.slice(i, i + len);
      if (KANA[k]) { out += KANA[k]; i += len; done = true; break; }
    }
    if (!done) { out += c; i++; }
  }
  return out;
}
const normAnswer = s => toReading(romajiToKana(String(s), true).replace(/[\s　。．.、,？?！!「」]/g, '')).replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60)).replace(/は/g, 'わ').replace(/へ/g, 'え').replace(/を/g, 'お');

};

// ─── FSRS-5: кривая забывания и планировщик ──────────────
const W = [0.40255, 1.18385, 3.173, 15.69105, 7.1949, 0.5345, 1.4604, 0.0046, 1.54575, 0.1192, 1.01925, 1.9395, 0.11, 0.29605, 2.2698, 0.2315, 2.9898, 0.51655, 0.6621];
const F = 19 / 81, DECAY = -0.5, TARGET = 0.9;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const d0 = g => clamp(W[4] - Math.exp(W[5] * (g - 1)) + 1, 1, 10);
// Сколько процентов памяти осталось через t дней при прочности S
const retention = (S, t) => Math.pow(1 + F * Math.max(0, t) / S, DECAY);
// «Забыл» = 0%, пока тема не оценена заново, хотя карточку только что видели
const memoryOf = (card, now = Date.now()) => card.relearn ? 0 : retention(card.S, (now - card.last) / DAY);
const intervalDays = S => Math.max(1, Math.round(S / F * (Math.pow(TARGET, 1 / DECAY) - 1)));

// Оценку ставишь ты сам: 1 забыл, 2 с трудом, 3 помню, 4 легко. Задания на неё не влияют.
function schedule(card, grade, now = Date.now()) {
  const today = dayNum(now);
  if (!card) {
    const S = W[grade - 1], D = d0(grade);
    return { S, D, last: now, due: today + intervalDays(S), reps: 1, lapses: grade === 1 ? 1 : 0, born: today, relearn: grade === 1 };
  }

// Разовая правка прогресса версии 1: каждая тема пройдена один раз с оценкой 4
function upgradeState(st) {
  if (st.v >= 2) return false;
  Object.keys(st.cards).forEach(id => {
    const c = st.cards[id];
    st.cards[id] = { ...schedule(null, 4, c.last), born: c.born };
  });
  st.v = 2;
  return true;
}

// ─── План дня ────────────────────────────────────────────
function freshState() {
  return { v: 2, start: dayNum(), cards: {}, log: {}, perDay: 5, furigana: true, theme: 'auto', auto: true, updated: 0 };
}
function duePool(st, now = Date.now()) {
  const today = dayNum(now);
  return TOPICS.filter(t => { const c = st.cards[t.id]; return c && (c.relearn || c.due <= today); })
    .sort((a, b) => memoryOf(st.cards[a.id], now) - memoryOf(st.cards[b.id], now));
}
function newPool(st, now = Date.now()) {
  const today = dayNum(now);
  const left = TOPICS.filter(t => !st.cards[t.id]);
  const base = left.filter(t => t.lesson <= BASE_LESSONS);
  if (base.length) return base; // уроки 1–12 — без лимита, пока не закрыты
  if (today === st.start) return [];
  const doneToday = TOPICS.filter(t => st.cards[t.id] && st.cards[t.id].born === today && t.lesson > BASE_LESSONS).length;
  return left.slice(0, Math.max(0, st.perDay - doneToday));
}
function overallMemory(st, now = Date.now()) {
  const ids = Object.keys(st.cards);
  if (!ids.length) return null;
  return ids.reduce((s, id) => s + memoryOf(st.cards[id], now), 0) / ids.length;
}
function lessonMemory(st, n, now = Date.now()) {
  const l = LESSONS.find(x => x.n === n), cs = l.topics.map(t => st.cards[t.id]).filter(Boolean);
  if (!cs.length) return null;
  return cs.reduce((s, c) => s + memoryOf(c, now), 0) / l.topics.length; // непройденные считаются как 0
}

function streak(st) {
  let d = dayNum(), n = 0;
  if (!st.log[d]) d--;
  while (st.log[d]) { n++; d--; }
  return n;
}
function forecast(st, days = 14) {
  const today = dayNum(), out = Array.from({ length: days }, () => 0);
  Object.values(st.cards).forEach(c => { const i = Math.max(0, c.due - today); if (i < days) out[i]++; });
  return out;
}

// Берём плитку, которую легче всего перепутать с лишней (読んで ↔ 読みて), и просим вписать её самому.
const plainKana = s => toReading(String(s)).replace(/[\s　。．.、,？?！!「」]/g, '');
function gapFrom(q) {
  if (q.k !== 'o' || !q.d || !q.d.length || q.t.length < 2) return null;
  const pref = (a, b) => { let i = 0; while (i < a.length && a[i] === b[i]) i++; return i; };
  let best = -1, score = 0;
  q.t.forEach((tile, i) => {
    const a = plainKana(tile);
    if (!a) return;
    q.d.forEach(d => { const b = plainKana(d); if (b === a) return; const s = Math.max(pref(a, b), [...a].filter(c => b.includes(c)).length / 2); if (s > score) { score = s; best = i; } });
  });
  if (best < 0 || score < 1) return null;
  const tile = q.t[best], sentence = q.t.map((x, i) => i === best ? '＿＿' : x).join(' ');
  const ans = [tile];
  if (/は$/.test(plainKana(tile))) ans.push(plainKana(tile).replace(/は$/, 'わ'));
  return { k: 'i', pre: q.q, q: sentence, a: ans, w: q.w, s: q.s, show: q.t.map((x, i) => i === best ? `[${x}]` : x).join(' '), from: q };
}
TOPICS.forEach(t => { t.gq = [...t.bq, ...(t.q || [])].map(gapFrom).filter(Boolean); });
// Из выбора: прячем в верном ответе слова, которыми он отличается от самого похожего неверного
function gapFromChoice(q) {
  if (q.k !== 'c' || /[а-яё]/i.test(q.o[0])) return null;
  const right = q.o[0].split(/\s+/);
  if (right.length < 2) return null;
  let best = null;
  q.o.slice(1).forEach(o => {
    const w = o.split(/\s+/);
    if (w.length !== right.length) return;
    const diff = right.map((x, i) => x !== w[i] ? i : -1).filter(i => i >= 0);
    if (diff.length && diff.length <= 2 && diff.length < right.length && (!best || diff.length < best.length)) best = diff;
  });
  if (!best) return null;
  const hide = best.map(i => right[i]).join(' ');
  if (!plainKana(hide)) return null;

}

// Дан смысл (или вопрос), пишешь всю фразу. В помощь — нужные слова, кроме того места, где проверяется грамматика.
const shuffleSeed = (a, seed) => { const r = [...a]; let x = seed; for (let i = r.length - 1; i > 0; i--) { x = (x * 9301 + 49297) % 233280; const j = x % (i + 1); [r[i], r[j]] = [r[j], r[i]]; } return r; };

  let best = -1, score = 0;
  q.t.forEach((tile, i) => { const a = plainKana(tile); if (!a) return;
    (q.d || []).forEach(d => { const b = plainKana(d); if (b === a) return; const s = Math.max(pref(a, b), [...a].filter(ch => b.includes(ch)).length / 2); if (s > score) { score = s; best = i; } }); });

// Ошибка в режиме «Блиц»: стабильность падает, процент темы сразу ниже, повтор ближе
function penalize(card, now = Date.now()) {
  if (!card) return null;
  const before = memoryOf(card, now);
  // Минус 10 процентных пунктов: стабильность ниже и как будто прошло больше времени с повтора
  card.S = Math.max(0.3, card.S * 0.8);
  const target = Math.max(0.3, before - 0.1);
  const t = card.S / F * (Math.pow(target, 1 / DECAY) - 1);
  card.last = now - t * DAY;
  card.due = Math.min(card.due, dayNum(card.last) + intervalDays(card.S));
  return [before, memoryOf(card, now)];
}

const KEY = 'bunpo.v1';
let st = freshState(), cloud = null, cloudStatus = 'local', saveTimer = null, saving = false, dirty = false;
const lsRead = () => { try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; } };
const lsWrite = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
const local = lsRead();
if (local && local.cards) {
  st = Object.assign(freshState(), local);
  if (upgradeState(st)) { st.updated = Date.now(); lsWrite(); }
}

function save() {
  st.updated = Date.now();
  lsWrite();
  dirty = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(pushCloud, 1200);
}
async function pushCloud() {
  if (!cloud || saving || !dirty) return;
  saving = true; dirty = false;
  try { await cloud.set(JSON.parse(JSON.stringify(st))); cloudStatus = 'cloud'; }
  catch (e) { dirty = true; cloudStatus = 'error'; }
  saving = false;
  if (dirty) saveTimer = setTimeout(pushCloud, 1500);
}
async function pullCloud() {
  if (!cloud) return;
  try {
    const snap = await cloud.get();
    const remote = snap.exists ? snap.data() : null;
    if (remote && remote.cards && (remote.updated || 0) > (st.updated || 0)) {
      st = Object.assign(freshState(), JSON.parse(JSON.stringify(remote)));
      if (upgradeState(st)) { st.updated = Date.now(); dirty = true; pushCloud(); }
      lsWrite();
      if (!S) render();
    } else if (st.updated && (!remote || (remote.updated || 0) < st.updated)) { dirty = true; pushCloud(); }
    cloudStatus = 'cloud';
  } catch (e) { cloudStatus = 'error'; }

}

const tableHtml = tb => `${tb.cap ? `<div class="cap">${rich(tb.cap)}</div>` : ''}<div class="tbl-w"><table>${tb.h.some(Boolean) ? `<thead><tr>${tb.h.map(h => `<th>${rich(h)}</th>`).join('')}</tr></thead>` : ''}<tbody>${tb.r.map(rowHtml).join('')}</tbody></table></div>`;
// Блоки появляются, только если они есть у темы

  const o = t.o ? sec('ОТКУДА', `<p>${rich(t.o)}</p>`) : '';

function chip(id) {

// ─── Занятие ─────────────────────────────────────────────
// Новая тема: читаешь, потом вопросы. Повтор: сразу вопросы. Процент верных с первого раза ставит оценку сам.
const QN_NEW = 10, QN_REVIEW = 6, QN_PRACTICE = 12;
let UNDO = [];
function startSession(queue, single) {
  S = { queue, i: 0, single: !!single, flash: null, done: 0, began: Date.now(), item: null };
  UNDO = [];
  window.scrollTo(0, 0);
  enterItem();
}
function buildQueue() {
  const now = Date.now();
  const q = duePool(st, now).map(t => ({ id: t.id, mode: st.cards[t.id].relearn ? 'relearn' : 'review' }));
  newPool(st, now).forEach(t => q.push({ id: t.id, mode: 'new' }));
  return q;
}
function stopSession() { clearTimeout(S && S.timer); S = null; UNDO = []; }
function enterItem() {
  clearTimeout(S.timer);
  if (S.i >= S.queue.length) { S.phase = 'done'; render(); return; }
  S.item = S.queue[S.i]; S.topic = BY_ID[S.item.id]; S.peek = false; S.showCard = false;
  if (S.item.mode === 'new' && !st.cards[S.item.id]) { S.phase = 'read'; render(); window.scrollTo(0, 0); return; }
  startQuiz();
}
// Сначала вопросы из учебника, остаток добирают свои. Ошибку зададут ещё раз в конце, но в процент она уже не идёт.
// Сначала задания, где пишешь предложение целиком; не хватает — письменные формы, потом выбор
function quizFor(t, n) {
  const pick = [], used = new Set();
  const add = q => { if (pick.length >= n || used.has(q) || (q.from && used.has(q.from))) return; pick.push(q); used.add(q); if (q.from) used.add(q.from); };
  const book = new Set(t.bq || []);
  shuffle([...(t.sq || [])].filter(q => book.has(q.from))).forEach(add);
  shuffle([...(t.sq || [])]).forEach(add);
  shuffle([...(t.bq || []), ...(t.q || [])].filter(q => q.k === 'i')).forEach(add);
  shuffle([...(t.gq || [])]).forEach(add);
  shuffle([...(t.bq || []), ...(t.q || [])]).forEach(add);
  return shuffle(pick).map(q => ({ q }));
}
function startQuiz() {
  S.qs = quizFor(S.topic, S.practice ? QN_PRACTICE : S.item.mode === 'new' ? QN_NEW : QN_REVIEW);
  S.t = 0; S.ok = 0; S.bad = 0; S.miss = []; S.phase = 'task';
  beginTask(); render(); window.scrollTo(0, 0); focusInput();
}
function sessMove(d) {
  if (S.practice || S.i + d < 0 || S.i + d >= S.queue.length) return;
  pushUndo();
  S.i += d; S.flash = null;
  navDir = d > 0 ? 'from-right' : 'from-left';
  enterItem();
}
const scoredN = () => S.qs.filter(x => !x.retry).length;
const quizScore = () => scoredN() ? S.ok / scoredN() : 1;
// Меньше 60% — тема не закрепилась; 60–79 — слабо; 80–99 — хорошо; 100% в повторе — легко. Подсмотрел — не выше «слабо».
function autoGrade() {
  const sc = quizScore(), fresh = !st.cards[S.item.id];
  let g = sc < 0.6 ? 1 : sc < 0.8 ? 2 : sc < 1 ? 3 : fresh ? 3 : 4;
  return S.peek ? Math.min(g, 2) : g;
}
function rate(grade) {
  pushUndo();
  const it = S.item, t = S.topic, prev = st.cards[it.id], now = Date.now();
  const card = schedule(prev || null, grade, now);
  st.cards[it.id] = card;
  const today = dayNum(now), lg = st.log[today] = st.log[today] || { n: 0, r: 0 };
  if (it.mode === 'new') lg.n++; else lg.r++;
  save();
  S.done++;
  if (grade <= 2) S.missed = (S.missed || 0) + 1;
  S.flash = `<b>${rich(t.t)}</b>: ${pct(quizScore())}% верно, ${grade === 1 ? 'вернётся в конце занятия' : 'повтор ' + dueLabel(card)}. <button class="linkish" data-act="undo">Отменить</button>`;
  if (grade === 1) S.queue.push({ id: it.id, mode: 'relearn' });
  S.i++;
  enterItem();
}

// Отмена: каждый ответ, переход и оценка кладут снимок. «Отменить» или Ctrl+Z возвращает на шаг назад.
function pushUndo() {
  if (!S) return;
  UNDO.push({ s: JSON.stringify({ ...S, topic: null, q: null, timer: null }), st: JSON.stringify(st) });
  if (UNDO.length > 80) UNDO.shift();
}
function undo() {
  const u = UNDO.pop(); if (!u) return;
  clearTimeout(S && S.timer);
  S = JSON.parse(u.s); S.topic = BY_ID[S.item.id]; if (S.qs && S.qs[S.t]) S.q = S.qs[S.t].q;
  const before = JSON.stringify(st);
  st = JSON.parse(u.st);
  if (JSON.stringify(st) !== before) save();
  render(); focusInput();
}

// Тренировка: те же вопросы, но память и расписание не трогает
function startPractice(id) {
  const topic = BY_ID[id];
  S = { practice: true, queue: [{ id, mode: 'practice' }], i: 0, item: { id, mode: 'practice' }, topic };
  UNDO = [];
  startQuiz();
}
// Блиц: случайный вопрос по пройденной теме, слабые темы выпадают чаще. Ошибка — минус процент.
function drillPool() { const ids = Object.keys(st.cards).filter(id => BY_ID[id]); return ids.length ? ids : TOPICS.filter(t => t.lesson <= 2).map(t => t.id); }
function drillNext() {
  const ids = drillPool(), now = Date.now();
  const w = ids.map(id => st.cards[id] ? 1.15 - memoryOf(st.cards[id], now) : 1);
  let r = Math.random() * w.reduce((a, b) => a + b, 0), i = 0;
  while (r > w[i] && i < ids.length - 1) { r -= w[i]; i++; }
  const id = ids[i], q = quizFor(BY_ID[id], 1)[0];
  return q ? { q: q.q, id } : null;
}
function startDrill() {
  S = { practice: true, drill: true, queue: [{ id: 'drill', mode: 'drill' }], i: 0, item: { id: TOPICS[0].id, mode: 'drill' }, topic: TOPICS[0], qs: [], t: 0, ok: 0, bad: 0, miss: [], phase: 'task', hits: {} };
  UNDO = [];
  S.qs.push(drillNext());
  beginTask(); render(); window.scrollTo(0, 0); focusInput();
}
function beginTask() {
  if (S.drill) { S.item = { id: S.qs[S.t].id, mode: 'drill' }; S.topic = BY_ID[S.qs[S.t].id]; }
  const q = S.qs[S.t].q;
  S.q = q; S.answered = null; S.typed = ''; S.hinted = false; S.hintLvl = 0;
  if (q.k === 'c') S.opts = shuffle(q.o.map((text, i) => ({ text, right: i === 0 })));
  if (q.k === 'o') { S.pool = shuffle([...q.t, ...(q.d || [])].map((text, i) => ({ text, id: i }))); S.picked = []; }
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function submit(ok, extra) {
  if (S.answered) return;
  pushUndo();
  const cur = S.qs[S.t];
  if (ok && S.hinted) { ok = false; extra = { ...extra, hinted: true }; }
  S.answered = { ok, ...extra };

  const same = order => got.length === order.length && got.every((x, i) => x === order[i]);

}
async function copyBackup() {

}

  try {
    const next = JSON.parse(el.value);
    if (!next || typeof next.cards !== 'object') throw 0;

  } catch (e) { backupText = el.value; backupMsg = 'Не получилось прочитать копию. Вставь текст целиком, без правок.'; }

}

document.addEventListener('keydown', e => {
  if (!S) {

    if (view === 'topic' && e.key === 'ArrowRight') stepTopic(1);
    return;
  }

});
